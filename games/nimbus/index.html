<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Nimbus — a cloud platformer by Shubham Das</title>
    <meta name="description" content="Nimbus: a 2D platformer through the clouds. Dodge the Umibozu and ravens, reach the Oracle and beat Apollo to make it rain." />
    <meta name="theme-color" content="#314d79" />
    <link rel="stylesheet" href="css/nimbus.css?v=1" />
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Nimbus game"></canvas>
    <div class="loading" id="loading">LOADING NIMBUS…</div>
    <button class="hud-btn" id="mute" type="button" aria-label="Mute sound">🔊</button>
    <div class="touch" id="touch" aria-hidden="true">
      <div class="group">
        <button class="big" data-key="left">◀</button>
        <button class="big" data-key="right">▶</button>
      </div>
      <div class="group">
        <button data-key="attack">HIT</button>
        <button data-key="dash">DASH</button>
        <button class="big" data-key="jump">⤒</button>
      </div>
    </div>
    <script src="js/data.js?v=3"></script>
    <script src="js/nimbus.js?v=3"></script>
  </body>
</html>
