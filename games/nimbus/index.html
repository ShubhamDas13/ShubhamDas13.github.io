<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Nimbus — a cloud platformer by Shubham Das</title>
    <meta name="description" content="Nimbus: a 2D platformer through the clouds. Dodge the Umibozu and ravens, reach the Oracle and beat Apollo to make it rain." />
    <meta name="theme-color" content="#314d79" />
    <style>
      html, body { margin: 0; height: 100%; background: #314d79; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 600 16px/1.4 Arial, sans-serif; letter-spacing: 0.1em; }
      .touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; align-items: flex-end; padding: 14px; pointer-events: none; }
      .touch.on { display: flex; }
      .touch .group { display: flex; gap: 10px; pointer-events: auto; }
      .touch button {
        width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); background: rgba(10,20,40,0.35);
        color: #fff; font: 700 13px Arial, sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent;
      }
      .touch button.big { width: 66px; height: 66px; font-size: 22px; }
      .touch button.down { background: rgba(255,255,255,0.35); }
      .hud-btn { position: fixed; top: 10px; right: 10px; width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff; font: 16px Arial; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Nimbus game"></canvas>
    <div class="loading" id="loading">LOADING NIMBUS…</div>
    <button class="hud-btn" id="mute" type="button" aria-label="Mute sound">🔊</button>
    <div class="touch" id="touch" aria-hidden="true">
      <div class="group">
        <button class="big" data-key="left">◀</button>
        <button class="big" data-key="right">▶</button>
      </div>
      <div class="group">
        <button data-key="attack">HIT</button>
        <button data-key="dash">DASH</button>
        <button class="big" data-key="jump">⤒</button>
      </div>
    </div>
    <script src="data.js?v=2"></script>
    <script src="nimbus.js?v=2"></script>
  </body>
</html>
