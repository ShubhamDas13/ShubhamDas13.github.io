<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1a2b" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Shubham Das</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230e1a2b'/%3E%3Crect x='14' y='18' width='22' height='7' rx='2' fill='%23f26b1d'/%3E%3Crect x='24' y='29' width='26' height='7' rx='2' fill='%23fbfcfd'/%3E%3Crect x='14' y='40' width='16' height='7' rx='2' fill='%23fbfcfd' opacity='.5'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; --navy: #0e1a2b; --line: #263a55; --orange: #f26b1d; --text: #e9eef5; --muted: #9fb0c6; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px;
        background-color: var(--navy); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
        background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      main { max-width: 560px; text-align: center; }
      .code { margin: 0; font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 0.8rem; letter-spacing: 0.12em; color: var(--orange); }
      h1 { margin: 14px 0 0; font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.05; letter-spacing: -0.02em; }
      p { margin: 18px 0 0; color: var(--muted); line-height: 1.6; }
      .route { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 34px 0 0; }
      .route i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
      .route i.on { background: var(--orange); border-color: var(--orange); }
      .route b { width: 40px; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); }
      .route b.cut { background: none; position: relative; }
      .route b.cut::after { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); color: var(--orange); font-size: 0.9rem; content: "✕"; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 36px; }
      a { padding: 12px 20px; border-radius: 8px; border: 1px solid #3b5274; color: var(--text); text-decoration: none; font-weight: 600; }
      a.primary { border-color: var(--orange); background: var(--orange); color: #fff; }
      a:hover { border-color: var(--text); }
      a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR 404 · LINK DOWN</p>
      <h1>This route didn’t make it to site.</h1>
      <p>The page you’re looking for doesn’t exist or has moved. Every other link is up and running.</p>
      <div class="route" aria-hidden="true"><i class="on"></i><b></b><i class="on"></i><b class="cut"></b><i></i><b></b><i></i></div>
      <nav aria-label="Where to next">
        <a class="primary" href="/">Work portfolio</a>
        <a href="/games.html">Arcade</a>
        <a href="/social.html">Social</a>
      </nav>
    </main>
  </body>
</html>
